<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Lounge | Harvisha Pictures</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    
    <link rel="icon" type="image/png" sizes="512x512" href="/images/favicon.png">
    <link class="apple-touch-icon" sizes="512x512" href="/images/favicon.png">


    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #000000; overflow: hidden; position: relative; }

        .color-blob { position: absolute; filter: blur(80px); z-index: 0; animation: float 10s infinite alternate ease-in-out; }
        .blob-1 { width: 400px; height: 400px; background: rgba(212, 175, 55, 0.4); top: -100px; left: -100px; border-radius: 50%; }
        .blob-2 { width: 500px; height: 500px; background: rgba(43, 43, 43, 0.8); bottom: -150px; right: -100px; border-radius: 50%; animation-delay: 2s; }
        .blob-3 { width: 300px; height: 300px; background: rgba(255, 255, 255, 0.1); top: 40%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; animation-duration: 15s; }

        @keyframes float { 0% { transform: translateY(0px) scale(1); } 100% { transform: translateY(30px) scale(1.1); } }

        .glass-panel { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 50px 40px; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); text-align: center; color: #ffffff; }

        .glass-panel h1 { font-size: 20px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; background: linear-gradient(135deg, #fff, #D4AF37); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-panel p.subtitle { font-size: 14px; font-weight: 300; color: rgba(255, 255, 255, 0.6); margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        input { width: 100%; padding: 16px 20px; font-size: 15px; color: #ffffff; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; outline: none; transition: all 0.3s ease; }
        input::placeholder { color: rgba(255, 255, 255, 0.4); }
        input:focus { background: rgba(255, 255, 255, 0.08); border-color: rgba(212, 175, 55, 0.5); box-shadow: 0 0 15px rgba(212, 175, 55, 0.1); }

        .btn-gold { width: 100%; padding: 16px; margin-top: 10px; font-size: 16px; font-weight: 600; color: #000000; background: #ffffff; border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; }
        .btn-gold:hover { background: #e6e6e6; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 255, 255, 0.2); }

        .forgot-link { display: inline-block; margin-top: 20px; font-size: 13px; color: rgba(255, 255, 255, 0.5); text-decoration: none; cursor: pointer; transition: color 0.3s; }
        .forgot-link:hover { color: #ffffff; }

        #status-msg { margin-top: 15px; font-size: 13px; color: #D4AF37; }

        #dashboard-section { display: none; text-align: left; }
        .couple-name { font-size: 26px; font-weight: 600; margin: 20px 0 15px 0; color: #fff; text-align: center; }
        .details-box { background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .details-box p { margin-bottom: 10px; font-size: 14px; color: #ccc; }
        .details-box strong { color: #D4AF37; }
    </style>
</head>
<body>

    <div class="color-blob blob-1"></div>
    <div class="color-blob blob-2"></div>
    <div class="color-blob blob-3"></div>

    <div class="glass-panel">
        <h1>Harvisha Pictures</h1>
        
        <!-- LOGIN SCREEN -->
        <div id="login-section">
            <p class="subtitle">Client Portal</p>
            <div class="input-group">
                <input type="email" id="email" placeholder="Email address" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password">
            </div>
            <button class="btn-gold" onclick="login()">Sign In</button>
            <br>
            <a onclick="resetPassword()" class="forgot-link">Forgot your password?</a>
            <p id="status-msg"></p>
        </div>

        <!-- DASHBOARD SCREEN -->
        <div id="dashboard-section">
            <p class="subtitle" style="text-align: center; margin-bottom: 5px;">Wedding Collection</p>
            <div class="couple-name" id="displayNames">Rahul & Neha</div>
            
            <div class="details-box">
                <p><strong>Date:</strong> <span id="displayDate">Loading...</span></p>
                <p><strong>Location:</strong> <span id="displayLocation">Loading...</span></p>
                <p><strong>Status:</strong> Digital assets are ready.</p>
            </div>

            <button class="btn-gold" id="driveButton" onclick="window.location.href='#'">View Your Gallery</button>
        </div>
    </div>

    <script>
        // Aapki Real Firebase Config Yahan Hai
        const firebaseConfig = {
          apiKey: "AIzaSyDW2s0BuiUhr7Xv22gZUfqCpdbCqR_LbFc",
          authDomain: "harvishaclient-portal.firebaseapp.com",
          projectId: "harvishaclient-portal",
          storageBucket: "harvishaclient-portal.firebasestorage.app",
          messagingSenderId: "630804126643",
          appId: "1:630804126643:web:317c48d0ec6a31f4a509c6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        async function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const statusBox = document.getElementById('status-msg');

            if(!email || !pass) {
                statusBox.innerText = "Please enter both email and password.";
                return;
            }

            statusBox.innerText = "Authenticating...";
            statusBox.style.color = "#D4AF37";

            try {
                await auth.signInWithEmailAndPassword(email, pass);
                statusBox.innerText = "Loading your gallery details...";

                const docRef = db.collection('clients').doc(email);
                const doc = await docRef.get();

                if (doc.exists) {
                    const data = doc.data();
                    
                    document.getElementById('displayNames').innerText = `${data.groom} & ${data.bride}`;
                    document.getElementById('displayDate').innerText = data.date;
                    document.getElementById('displayLocation').innerText = data.location;
                    
                    document.getElementById('driveButton').onclick = function() {
                        window.location.href = data.driveUrl;
                    };

                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard-section').style.display = 'block';
                } else {
                    statusBox.innerText = "No data found for this account.";
                }
            } catch (error) {
                statusBox.innerText = "Invalid Email or Password.";
                statusBox.style.color = "#ff4d4d"; 
            }
        }

        async function resetPassword() {
            const email = document.getElementById('email').value;
            const statusBox = document.getElementById('status-msg');

            if(!email) {
                statusBox.innerText = "Please enter your email above to reset password.";
                statusBox.style.color = "#ff4d4d";
                return;
            }

            statusBox.innerText = "Sending reset link...";
            statusBox.style.color = "#D4AF37";

            try {
                await auth.sendPasswordResetEmail(email);
                statusBox.innerText = "Reset link sent! Please check your email inbox.";
                statusBox.style.color = "#28a745"; 
            } catch (error) {
                statusBox.innerText = "Error: Email not found or invalid.";
                statusBox.style.color = "#ff4d4d"; 
            }
        }
    </script>
</body>
</html>
