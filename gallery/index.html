<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    
    <title>Our Portfolio Gallery | Harvisha Pictures</title>
    <meta name="title" content="Our Portfolio Gallery | Harvisha Pictures">
    <meta name="description" content="Explore the luxurious and cinematic wedding photography gallery by Harvisha Pictures. View our premium portfolio of weddings, pre-weddings, maternity, and more.">
    <meta name="keywords" content="wedding photography, Harvisha Pictures gallery, Kolkata wedding photographer, pre-wedding photoshoot, cinematic wedding films, maternity shoot, event photography">
    <meta name="author" content="Harvisha Pictures">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Our Portfolio Gallery | Harvisha Pictures">
    <meta property="og:description" content="Discover our cinematic wedding and event photography portfolio. Crafted with love by Harvisha Pictures.">
    <meta property="og:image" content="https://www.harvishapictures.in/images/Picture%201.jpg">
    <meta property="og:url" content="https://www.harvishapictures.in/gallery.html">

    <link rel="icon" type="image/png" sizes="512x512" href="../images/favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="../images/favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* --- LIQUID BACKGROUND ANIMATION --- */
        body {
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            background: linear-gradient(-45deg, #050505, #111111, #1a1505, #0a0a0a);
            background-size: 400% 400%;
            animation: liquidFluid 15s ease infinite;
        }

        @keyframes liquidFluid {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- HEADER & NAVIGATION --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .logo img {
            max-height: 40px;
        }

        .back-btn {
            color: #d4af37;
            font-size: 13px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        
        .back-btn:hover {
            color: #ffffff;
            background: rgba(212, 175, 55, 0.2);
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        /* --- PAGE HEADER --- */
        .page-header {
            padding: 140px 5% 50px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .page-header h1 {
            font-family: "Playfair Display", serif;
            font-size: 52px;
            background: linear-gradient(to right, #d4af37, #f3e5ab, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            text-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
        }

        .page-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* --- FILTER BUTTONS --- */
        .filter-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 0 5% 50px;
            position: relative;
            z-index: 10;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 28px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
        }

        /* --- GALLERY GRID --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 0 5% 80px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .gallery-item {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            aspect-ratio: 4/5;
            cursor: pointer;
            opacity: 1;
            transform: scale(1);
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        .gallery-item.hidden {
            display: none;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
            opacity: 0.95;
            user-select: none; /* Prevents text selection on swipe */
        }

        .gallery-item:hover {
            transform: translateY(-8px);
            border-color: rgba(212, 175, 55, 0.3);
            box-shadow: 0 15px 45px 0 rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.15);
        }

        .gallery-item:hover img {
            transform: scale(1.1);
            opacity: 1;
        }

        .gallery-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            align-items: flex-end;
            padding: 25px;
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }
        
        .overlay-icon {
            color: #d4af37;
            font-size: 24px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            transform: translateY(15px);
            transition: transform 0.4s ease;
        }

        .gallery-item:hover .overlay-icon {
            transform: translateY(0);
        }

        /* --- LIGHTBOX (IMAGE POPUP - LIQUID GLASS) --- */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
            transform: scale(0.9);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
            user-select: none; /* Prevents selection on swipe */
        }

        .lightbox.active img {
            transform: scale(1);
            opacity: 1;
        }

        /* Lightbox Controls (Close, Prev, Next) */
        .lightbox-control {
            position: absolute;
            color: rgba(255,255,255,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2010;
        }

        .lightbox-control:hover {
            color: #111;
            background: #d4af37;
            border-color: #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .lightbox-close {
            top: 30px;
            right: 30px;
            font-size: 30px;
            width: 50px;
            height: 50px;
        }

        .lightbox-close:hover {
            transform: rotate(90deg);
        }

        .lightbox-nav {
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            font-size: 24px;
        }

        .lightbox-prev {
            left: 30px;
        }

        .lightbox-next {
            right: 30px;
        }

        /* Prevent button hover effect jump on click */
        .lightbox-nav:active {
            transform: translateY(-50%) scale(0.9);
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 15px;
            }
            .page-header h1 {
                font-size: 38px;
            }
            .filter-btn {
                padding: 10px 18px;
                font-size: 10px;
            }
            
            /* Mobile Lightbox Controls */
            .lightbox-close {
                top: 15px;
                right: 15px;
                width: 40px;
                height: 40px;
                font-size: 24px;
            }
            .lightbox-nav {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
            .lightbox-prev { left: 10px; }
            .lightbox-next { right: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="logo">
            <img src="../images/logow.png" alt="Harvisha Pictures">
        </a>
        <a href="../index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>
    </header>

    <section class="page-header">
        <h1>Our Gallery</h1>
        <p>Capturing Timeless Moments</p>
    </section>

    <div class="filter-container" id="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="wedding">Wedding</button>
        <button class="filter-btn" data-filter="prewedding">Pre-Wedding</button>
        <button class="filter-btn" data-filter="anniversary">Anniversary</button>
        <button class="filter-btn" data-filter="engagement">Engagement</button>
        <button class="filter-btn" data-filter="maternity">Maternity</button>
    </div>

    <div class="gallery-grid" id="gallery-container">
        </div>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-control lightbox-close" id="lightbox-close" title="Close (Esc)">&times;</span>
        <div class="lightbox-control lightbox-nav lightbox-prev" id="lightbox-prev" title="Previous (Left Arrow)">
            <i class="fa-solid fa-chevron-left"></i>
        </div>
        
        <img src="" alt="Full Screen Preview" id="lightbox-img">
        
        <div class="lightbox-control lightbox-nav lightbox-next" id="lightbox-next" title="Next (Right Arrow)">
            <i class="fa-solid fa-chevron-right"></i>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const portfolioData = [
                { category: 'wedding', folder: 'Wedding', prefix: 'wedding' }, 
                { category: 'prewedding', folder: 'Prewedding', prefix: 'prewedding' },
                { category: 'anniversary', folder: 'Anniversary', prefix: 'anniversary' },
                { category: 'engagement', folder: 'Engagement', prefix: 'engagement' },
                { category: 'maternity', folder: 'Maternity', prefix: 'maternity' }
            ];

            const galleryContainer = document.getElementById('gallery-container');

            // --- AUTO IMAGE LOADER ---
            function loadImagesAuto(data, index) {
                const imagePath = `../our portfolio/${data.folder}/${data.prefix} (${index}).jpg`;
                const testerImg = new Image();
                
                testerImg.onload = function() {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = `gallery-item ${data.category}`;
                    itemDiv.setAttribute('data-category', data.category);
                    
                    itemDiv.innerHTML = `
                        <img src="${imagePath}" alt="${data.folder} Image ${index}" loading="lazy">
                        <div class="gallery-overlay">
                            <i class="fa-solid fa-expand overlay-icon"></i>
                        </div>
                    `;
                    
                    galleryContainer.appendChild(itemDiv);
                    loadImagesAuto(data, index + 1); // Load next
                };
                
                testerImg.onerror = function() { /* End of folder reached */ };
                testerImg.src = imagePath;
            }

            portfolioData.forEach(data => loadImagesAuto(data, 1));

            // --- FILTERING LOGIC ---
            const filterBtns = document.querySelectorAll('.filter-btn');
            
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const filterValue = btn.getAttribute('data-filter');
                    const allGalleryItems = document.querySelectorAll('.gallery-item');

                    allGalleryItems.forEach(item => {
                        if (filterValue === 'all' || item.getAttribute('data-category') === filterValue) {
                            item.classList.remove('hidden');
                        } else {
                            item.classList.add('hidden');
                        }
                    });
                });
            });

            // --- LIGHTBOX & NAVIGATION LOGIC ---
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxClose = document.getElementById('lightbox-close');
            const btnNext = document.getElementById('lightbox-next');
            const btnPrev = document.getElementById('lightbox-prev');
            
            // State variables to track navigation
            let currentVisibleItems = [];
            let currentIndex = 0;

            // Open Lightbox
            galleryContainer.addEventListener('click', (e) => {
                const item = e.target.closest('.gallery-item');
                if (item) {
                    // Update array of only visible images based on current filter
                    currentVisibleItems = Array.from(document.querySelectorAll('.gallery-item:not(.hidden)'));
                    currentIndex = currentVisibleItems.indexOf(item);
                    
                    updateLightboxImage();
                    lightbox.classList.add('active');
                    document.body.style.overflow = 'hidden'; 
                }
            });

            // Navigation Functions
            function updateLightboxImage() {
                if(currentVisibleItems.length === 0) return;
                
                // Slight fade effect when changing images
                lightboxImg.style.opacity = '0';
                setTimeout(() => {
                    const imgSrc = currentVisibleItems[currentIndex].querySelector('img').src;
                    lightboxImg.src = imgSrc;
                    lightboxImg.style.opacity = '1';
                }, 150); // Matches halfway point of CSS transition
            }

            function showNext(e) {
                if (e) e.stopPropagation();
                if (currentVisibleItems.length <= 1) return;
                currentIndex = (currentIndex + 1) % currentVisibleItems.length;
                updateLightboxImage();
            }

            function showPrev(e) {
                if (e) e.stopPropagation();
                if (currentVisibleItems.length <= 1) return;
                currentIndex = (currentIndex - 1 + currentVisibleItems.length) % currentVisibleItems.length;
                updateLightboxImage();
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto'; 
                setTimeout(() => lightboxImg.src = "", 400); 
            }

            // Click Events for Nav Buttons
            btnNext.addEventListener('click', showNext);
            btnPrev.addEventListener('click', showPrev);
            lightboxClose.addEventListener('click', closeLightbox);
            
            // Close when clicking empty space
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            // Keyboard Events
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                
                if (e.key === 'ArrowRight') showNext();
                else if (e.key === 'ArrowLeft') showPrev();
                else if (e.key === 'Escape') closeLightbox();
            });

            // Mobile Swipe Support
            let touchStartX = 0;
            let touchEndX = 0;
            
            lightbox.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true }); // passive true for better mobile scrolling performance

            lightbox.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                const swipeThreshold = 50; // Minimum pixel drag to trigger change
                if (touchEndX < touchStartX - swipeThreshold) {
                    showNext(); // Swipe left
                }
                if (touchEndX > touchStartX + swipeThreshold) {
                    showPrev(); // Swipe right
                }
            }
        });
    </script>

</body>
</html>
